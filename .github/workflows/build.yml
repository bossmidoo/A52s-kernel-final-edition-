name: Build a52sxq kernel (KernelSU-Next manual hooks)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repo"
        default: "anhdat1024/android_kernel_samsung_sm7325"
      kernel_branch:
        description: "Kernel branch"
        default: "17.0"
      ksun_branch:
        description: "KernelSU-Next branch (must be 'legacy' for manual hooks)"
        default: "legacy"
      disable_userfaultfd:
        description: "Disable CONFIG_USERFAULTFD like CrappyKernel (true/false)"
        default: "false"
      usb_extra:
        description: "Also enable plain USB RNDIS+ECM (not needed: ROM uses gsi.rndis) (true/false)"
        default: "false"
      tweaks:
        description: "Apply network tweaks: BBR + fq_codel (true/false)"
        default: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4          # this repo: patches/

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip lz4 python3 device-tree-compiler

      - name: Clone kernel
        run: git clone --depth=1 -b "${{ inputs.kernel_branch }}" "https://github.com/${{ inputs.kernel_repo }}" kernel

      - name: Clone toolchain (Proton clang) and AnyKernel3
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3

      - name: Apply manual hooks
        working-directory: kernel
        run: git apply --whitespace=nowarn ../ksu-manual-hooks-5.4.302.patch

      - name: Add KernelSU-Next
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.ksun_branch }}/kernel/setup.sh" | bash -s ${{ inputs.ksun_branch }}

      - name: Configure
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          ARGS="O=out ARCH=arm64 LLVM=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          echo "ARGS=$ARGS" >> $GITHUB_ENV
          make $ARGS vendor/lineage-a52sxq_defconfig
          scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -d KSU_SUSFS -d KSU_KPROBES_HOOK
          if [ "${{ inputs.disable_userfaultfd }}" = "true" ]; then scripts/config --file out/.config -d USERFAULTFD; fi
          if [ "${{ inputs.tweaks }}" = "true" ]; then
            # Network: BBR congestion control (default was BIC) + fq_codel default qdisc (was pfifo_fast)
            scripts/config --file out/.config -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -d DEFAULT_BIC -e DEFAULT_BBR \
              -e NET_SCH_FQ -e NET_SCH_FQ_CODEL -e NET_SCH_DEFAULT -e DEFAULT_FQ_CODEL
          fi
          # Extras: CAKE, TTL/HL targets, Samsung MTP VID/PID.
          # NOTE: IFB is intentionally NOT enabled: it selects NET_REDIRECT, which changes struct sk_buff
          # and breaks the CRCs of the prebuilt vendor modules (wlan etc. fail to load -> bootloop).
          scripts/config --file out/.config -e NET_SCH_CAKE -e NETFILTER_XT_TARGET_HL -e IP_NF_TARGET_TTL -e IP6_NF_TARGET_HL \
            -e USB_CONFIGFS_SAMSUNG_VIDPID
          if [ "${{ inputs.usb_extra }}" = "true" ]; then scripts/config --file out/.config -e USB_CONFIGFS_RNDIS -e USB_CONFIGFS_ECM; fi
          make $ARGS olddefconfig
          grep -E "CONFIG_KSU|USERFAULTFD|DEFAULT_TCP_CONG|TCP_CONG_BBR|DEFAULT_NET_SCH|NET_SCH_FQ|NET_SCH_CAKE|NET_REDIRECT|TARGET_HL|TARGET_TTL|USB_CONFIGFS_(RNDIS|ECM|SAMSUNG)" out/.config

      - name: Build
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          set +e
          make $ARGS -j$(nproc) Image.gz dtbs > build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "=== FIRST ERRORS ==="
            grep -nE "error:|Error [0-9]|undefined|No rule|fatal" build.log | head -30
            echo "=== CONTEXT ==="
            grep -n -m1 -B15 -A5 -E "error:|No rule|undefined" build.log
            exit 1
          fi
          ls -la out/arch/arm64/boot/

      - name: Package recovery-flashable zip (CrappyKernel style)
        run: |
          mkdir -p pkg/META-INF/com/google/android pkg/tools
          cp kernel/out/arch/arm64/boot/Image.gz pkg/Image.gz
          cp ak3/tools/magiskboot ak3/tools/busybox pkg/tools/
          cat > pkg/banner <<'BANNER'
          ==========================================
            A52s  KERNEL  5.4.302  +  KernelSU-Next
          ==========================================
          BANNER
          sed -i 's/^          //' pkg/banner
          echo "# Dummy file; update-binary is a shell script." > pkg/META-INF/com/google/android/updater-script
          cat > pkg/META-INF/com/google/android/update-binary <<'UPDATEBINARY'
          #!/sbin/sh
          # A52s kernel recovery installer (CrappyKernel-style UI).
          # Repacks the kernel into the boot partition you already have: ramdisk, header and cmdline are kept.

          OUTFD=/proc/self/fd/$2
          ZIPFILE="$3"
          WORK=""
          BOOTPART="${BOOTPART_OVERRIDE:-}"

          ui_print()     { while [ "$1" ]; do echo "ui_print $1" >> "$OUTFD"; echo "ui_print" >> "$OUTFD"; shift; done; }
          ui_printfile() { unzip -p "$ZIPFILE" "$1" 2>/dev/null | while IFS= read -r l; do ui_print "$l"; done; }
          set_progress() { echo "set_progress $1" >> "$OUTFD"; }
          abort_flash()  { ui_print " "; ui_print "X $1"; ui_print "X Nothing was written to your boot partition."; [ -n "$WORK" ] && rm -rf "$WORK"; exit 1; }

          set_progress 0.0
          ui_printfile "banner"
          ui_print " "

          # device check (same method as CrappyKernel)
          getprop ro.boot.bootloader | grep -qE "A528" || abort_flash "Unsupported device (needs SM-A528x). Aborting."

          # boot partition
          if [ -z "$BOOTPART" ]; then
            for p in /dev/block/bootdevice/by-name/boot /dev/block/by-name/boot; do
              [ -e "$p" ] && { BOOTPART="$p"; break; }
            done
          fi
          [ -n "$BOOTPART" ] && [ -e "$BOOTPART" ] || abort_flash "boot partition not found."
          ui_print "-> boot partition: $BOOTPART"

          # work dir (prefer /cache like CrappyKernel, fall back to /tmp)
          mount -o rw,remount -t auto /cache 2>/dev/null
          WORK="/cache/a52kernel"
          mkdir -p "$WORK" 2>/dev/null && [ -w "$WORK" ] || { WORK="/tmp/a52kernel"; mkdir -p "$WORK"; }
          rm -rf "$WORK"/* 2>/dev/null

          ui_print "-> Extracting files..."
          unzip -o "$ZIPFILE" "tools/*" "Image.gz" -d "$WORK" >/dev/null 2>&1
          [ -f "$WORK/Image.gz" ] && [ -f "$WORK/tools/magiskboot" ] || abort_flash "zip is incomplete."
          chmod 755 "$WORK"/tools/* 2>/dev/null
          MB="$WORK/tools/magiskboot"
          BB="$WORK/tools/busybox"
          set_progress 0.2

          ui_print "-> Reading current boot image..."
          cd "$WORK" || abort_flash "cannot enter work dir."
          dd if="$BOOTPART" of=boot_orig.img bs=4096 2>/dev/null
          [ -s boot_orig.img ] || abort_flash "could not read boot partition."

          # keep a copy of the original so you can restore it
          for d in /data/media/0 /sdcard; do
            if [ -d "$d" ] && [ -w "$d" ]; then
              cp boot_orig.img "$d/boot_backup_before_a52kernel.img" 2>/dev/null && ui_print "-> Backup saved: $d/boot_backup_before_a52kernel.img" && break
            fi
          done
          set_progress 0.4

          ui_print "-> Unpacking boot image..."
          "$MB" unpack boot_orig.img >/dev/null 2>&1 || abort_flash "magiskboot could not unpack your boot image."
          [ -f kernel ] || abort_flash "no kernel found in boot image."

          ui_print "-> Replacing kernel..."
          cp -f Image.gz kernel || abort_flash "could not place new kernel."
          "$MB" repack boot_orig.img boot_new.img >/dev/null 2>&1 || abort_flash "repack failed."
          [ -s boot_new.img ] || abort_flash "repacked image is empty."
          set_progress 0.6

          # sanity: new image must fit in the partition and look like a boot image
          NEWSIZE=$("$BB" wc -c < boot_new.img)
          PARTSIZE=$(blockdev --getsize64 "$BOOTPART" 2>/dev/null)
          [ -n "$PARTSIZE" ] && [ "$NEWSIZE" -gt "$PARTSIZE" ] && abort_flash "new boot image ($NEWSIZE) is larger than the partition ($PARTSIZE)."
          [ "$("$BB" head -c 8 boot_new.img)" = "ANDROID!" ] || abort_flash "repacked image has no ANDROID! header."

          ui_print "-> Flashing boot.img..."
          dd if=boot_new.img of="$BOOTPART" bs=4096 2>/dev/null || abort_flash "write failed (check your boot partition!)."
          sync
          set_progress 0.9

          # verify what was written (uses the busybox from the zip; empty result = failure)
          W=$("$BB" head -c "$NEWSIZE" "$BOOTPART" | "$BB" md5sum | cut -d' ' -f1)
          N=$("$BB" md5sum boot_new.img | cut -d' ' -f1)
          if [ -z "$W" ] || [ -z "$N" ] || [ "$W" != "$N" ]; then
            ui_print " "
            ui_print "X VERIFY FAILED. Do NOT reboot; flash your backup boot image."
            exit 1
          fi
          ui_print "-> Verified OK."

          cd /
          rm -rf "$WORK"
          set_progress 1.0
          ui_print " "
          ui_print "=========================================="
          ui_print "  A52s kernel installed successfully!"
          ui_print "  vendor_boot was NOT touched."
          ui_print "=========================================="
          ui_print " "
          exit 0
          UPDATEBINARY
          sed -i 's/^          //' pkg/META-INF/com/google/android/update-binary
          chmod 755 pkg/META-INF/com/google/android/update-binary pkg/tools/*
          rm -rf ak3/.git
          ls -laR pkg | head -30

      # The downloaded artifact is itself the flashable zip (files at its root): flash it from recovery.
      - uses: actions/upload-artifact@v4
        with:
          name: a52sxq-kernel-recovery
          path: pkg/
